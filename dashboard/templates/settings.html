<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Settings</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;padding:1rem;background:#f6f6f6;color:#111}h1{font-size:1.4rem}.top{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.top a{background:#111;color:white;text-align:center;padding:.8rem;border-radius:8px;text-decoration:none;font-weight:700}.card{background:white;border-radius:10px;padding:1rem;margin-top:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}label{display:block;font-weight:700;margin-top:.9rem}input{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid #ccc;border-radius:8px;font-size:1rem}.hint{color:#666;font-size:.85rem}button{margin-top:1rem;width:100%;padding:1rem;background:#159947;color:white;border:0;border-radius:8px;font-size:1rem;font-weight:700}.saved{background:#e8ffe8;border:1px solid #159947;padding:.75rem;border-radius:8px;margin-bottom:.75rem}
  </style>
</head>
<body>
  <h1>API Settings</h1>
  <div class="top">
    <a href="/?password={{ password }}">Dashboard</a>
    <a href="/settings?password={{ password }}">API Settings</a>
  </div>
  <div class="card">
    {% if saved %}<div class="saved">Saved. Blank fields kept old values.</div>{% endif %}
    <p class="hint">Enter keys here directly in your own deployed dashboard. Saved secrets are masked.</p>
    <form method="post" action="/settings/save?password={{ password }}">
      {% for key in keys %}
        <label>{{ key }}</label>
        <input name="{{ key }}" placeholder="{% if masked[key] %}Current: {{ masked[key] }}{% else %}Enter {{ key }}{% endif %}">
        <div class="hint">Leave blank to keep saved value.</div>
      {% endfor %}
      <button type="submit">Save API Settings</button>
    </form>
  </div>
</body>
</html>
